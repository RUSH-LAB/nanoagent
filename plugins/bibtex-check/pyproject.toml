[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-bibtex-check"
version = "0.1.0"
description = "Check an LLM-generated BibTeX file against verified reference entries"
requires-python = ">=3.12"
dependencies = ["bibtexparser>=2.1,<3", "mcp>=1.27,<2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import the verifier package from the plugin root.
pythonpath = ["."]
