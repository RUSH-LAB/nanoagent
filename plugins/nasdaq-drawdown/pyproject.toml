[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-nasdaq-drawdown"
version = "0.1.0"
description = "The Nasdaq-100 constituents that fell at least 5% over a week, from Nasdaq's API"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import the verifier package from the plugin root.
pythonpath = ["."]
