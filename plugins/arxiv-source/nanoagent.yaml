spec: nanoagent.plugin/v1
id: arxiv-source
name: arXiv Search and Source Downloader
version: 0.3.0
runtime:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]
permissions:
  network:
    hosts: [export.arxiv.org]
  filesystem:
    write: [workspace]
tools:
  - name: search_papers
    description: Search arXiv and return the matching papers' metadata
    input: schemas/search-input.json
    output: schemas/search-output.json
  - name: download_source
    description: Download and safely unpack an arXiv paper source archive
    input: schemas/download-input.json
    output: schemas/download-output.json
  - name: save_search_results
    description: Search arXiv, then download and unpack every result's source archive
    input: schemas/save-input.json
    output: schemas/save-output.json
  - name: list_daily_papers
    description: List the papers arXiv shows for each person, first submitted on a date
    input: schemas/daily-input.json
    output: schemas/daily-output.json
  - name: save_raw_paper
    description: Save a paper's source under docs/raw/{first_author_name}-{paper_short_name}-{arxiv_id}-{date}
    input: schemas/raw-input.json
    output: schemas/raw-output.json
  - name: write_digest
    description: Write the daily digest as docs/digest-{date}.json and .md
    input: schemas/digest-input.json
    output: schemas/digest-output.json
tasks:
  - id: search-papers
    description: Find arXiv papers matching a query
    runner: tool
    tools: [search_papers]
    input: schemas/search-input.json
    reference: null
    instructions: Search arXiv with the query and return the matching papers, best match first.
  - id: save-paper-source
    description: Save an arXiv paper source archive into a folder
    runner: tool
    tools: [download_source]
    input: schemas/download-input.json
    reference: null
    instructions: Validate the arXiv ID, download its source, unpack it safely, and return the saved files.
  - id: save-search-results
    description: Search arXiv and save the source of every matching paper
    runner: tool
    tools: [save_search_results]
    input: schemas/save-input.json
    reference: null
    instructions: Search arXiv with the query, then download and unpack each result's source into its own folder.
  - id: find-and-save-paper
    description: Find the paper a request describes and save its source
    runner: agent
    tools: [search_papers, download_source]
    input: schemas/search-input.json
    reference: null
    instructions: Search arXiv for the requested paper, pick the result that matches the request, then download and unpack its source.
  - id: daily-digest
    description: Write a digest of the monitored people's new arXiv papers for a date, saving each paper's source
    runner: agent
    tools: [search_papers, save_raw_paper, write_digest]
    input: schemas/daily-input.json
    reference: list_daily_papers
    instructions: |-
      For each person, call search_papers with the query au:"<full name>" AND submittedDate:[YYYYMMDD0000 TO YYYYMMDD2359] for the date (max_results 50); these are the papers first submitted that day. A paper by several monitored people is one paper.
      Save every paper with save_raw_paper, passing its id without the version (YYMM.NNNNN) and the date.
      Then call write_digest once with one entry per paper: arxiv_id without the version, title and authors exactly as search_papers returned them, a summary of exactly two lines of your own words (separated by one newline), and link https://arxiv.org/abs/<arxiv_id>.
      Finish with a one-paragraph report of what you saved.
