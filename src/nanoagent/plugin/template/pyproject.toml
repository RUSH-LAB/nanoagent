[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-{{id}}"
version = "0.1.0"
description = "{{name}}: a NanoAgent plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
