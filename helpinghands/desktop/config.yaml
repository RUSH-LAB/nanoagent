# The desktop app's build inputs. scripts/stage.mjs reads it at build time and bundles it;
# src-tauri/src/supervisor.rs reads the bundled copy at run time.

# The Mochi this app serves: its window shows the site, and its relay (src/runner/relay.mjs)
# lends this computer's NanoAgent to the signed-in member's runs there.
site_url: https://rush-lab.org
# NanoAgent's loopback port. Away from npm start's 8787, so the app and a development checkout
# run side by side.
nanoagent_port: 47311
# The member's own files in each workspace they are in, <home>/<files_folder>/<workspace>/, kept in
# sync both ways with their home there by the relay (src/runner/files.mjs).
files_folder: rushlab

# RUSH Lab without its window (src/runner/install.sh, lab.mjs) is installed once per account on a
# computer, under `label`: its service, and its data folder in ~/Library/Application Support/ or
# ~/.local/share/. It serves a connection for each member of each site installed there, each with
# its own NanoAgent on a free port, and each member's files in <home>/<files folder>/<login>/:
# files_folder for site_url, other_site's for any other (a development checkout's npm start).
label: lab.mochi.lab
other_site:
  files_folder: rushlab-dev

# Bundled runtimes. Node runs the relay and NanoAgent's PI runner; uv installs NanoAgent's
# dependencies (uv.lock) on first launch, on the Python NanoAgent is compiled for, and runs its plugins.
node_version: 22.23.3
uv_version: 0.12.22
python_version: "3.12"

# Windows only: plugins are built with git, which uv runs to fetch a git dependency. Git for Windows'
# own shell (MSYS) cannot start in the AppContainer plugins run in (nanoagent.plugin.sandbox), so the
# app bundles MinGit with busybox-w32 as its usr/bin/sh.exe, both checked against these sha256s.
mingit_release: v2.56.0.windows.2
mingit_version: 2.56.0.2
mingit_sha256: da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be
busybox_build: FRP-6075-g169694ebd
busybox_sha256: 6e263d154d8548d1eb936f65d1d8312c80df31c45974e48d6335e4dcc0f4f34c
