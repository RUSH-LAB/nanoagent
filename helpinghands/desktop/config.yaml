# The desktop app's build inputs. scripts/stage.mjs reads it at build time and bundles it;
# src-tauri/src/supervisor.rs reads the bundled copy at run time.

# The Mochi this app serves: its window shows the site, and its relay (src/runner/relay.mjs)
# lends this computer's NanoAgent to the signed-in member's runs there.
site_url: https://rush-lab.org
# NanoAgent's loopback port. Away from npm start's 8787, so the app and a development checkout
# run side by side.
nanoagent_port: 47311
# The member's own files in each workspace they are in, <home>/<files_folder>/<workspace>/, kept in
# sync both ways with their home there by the relay (src/runner/files.mjs).
files_folder: rushlab

# RUSH Lab without its window (src/runner/install.sh, lab.mjs) is installed under `label`: its
# service, and its data folder in ~/Library/Application Support/ or ~/.local/share/. Installed from
# any other site than site_url (a development checkout's npm start), it runs beside that one, under
# its own label, NanoAgent port and files folder.
label: lab.mochi.lab
other_site:
  label: lab.mochi.lab.dev
  nanoagent_port: 47312
  files_folder: rushlab-dev

# Bundled runtimes. Node runs the relay and NanoAgent's PI runner; uv installs NanoAgent's
# dependencies (uv.lock) on first launch, on the Python NanoAgent is compiled for, and runs its plugins.
node_version: 22.23.3
uv_version: 0.12.22
python_version: "3.12"
