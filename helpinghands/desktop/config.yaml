# The RUSH Lab app's build inputs. scripts/stage.mjs reads it at build time and bundles it as
# config.json, which src-tauri/src/lab.rs and src/runner/lab.mjs read at run time.

# The Mochi this app serves: the menu's Open RUSH Lab, and the site a connect link may name besides
# a development checkout's on this computer (lab.mjs connectableSite).
site_url: https://rush-lab.org
# The member's own files in each workspace they are in, <home>/<files_folder>/<login>/, kept in
# sync both ways with their home there by the relay (src/runner/files.mjs).
files_folder: rushlab

# RUSH Lab is installed once per account on a computer, under `label`: its data folder in
# ~/Library/Application Support/. It serves a connection for each member of each site connected
# there, each with its own NanoAgent on a free port, and each member's files in
# <home>/<files folder>/<login>/: files_folder for site_url, other_site's for any other (a
# development checkout's npm start).
label: lab.mochi.lab
other_site:
  files_folder: rushlab-dev

# Bundled runtimes. Node runs lab.mjs, the relay and NanoAgent's PI runner; uv installs NanoAgent's
# dependencies (uv.lock) on first launch, on the Python NanoAgent is compiled for, and runs its plugins.
node_version: 22.23.3
uv_version: 0.12.22
python_version: "3.12"
