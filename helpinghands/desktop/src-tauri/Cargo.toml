[package]
name = "mochi-lab-desktop"
version = "0.0.0"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
# The engine (engine.rs): downloaded, checked against its sha256 and the update key, and unpacked,
# with the crates the updater uses for its own.
base64 = "0.22"
flate2 = "1"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-authentication-services = { version = "0.3", features = ["ASWebAuthenticationSession", "ASFoundation", "ASWebAuthenticationSessionCallback", "block2"] }
objc2-foundation = "0.3"
