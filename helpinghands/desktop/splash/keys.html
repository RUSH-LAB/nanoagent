<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mochi Lab · API keys</title>
  <style>
    body { margin: 0; font: 15px -apple-system, system-ui, sans-serif; color: #333; background: #fafafa; }
    main { width: min(720px, 92vw); margin: 0 auto; padding: 32px 0; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 16px; color: #555; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; overflow: hidden; }
    td { padding: 10px 12px; border-top: 1px solid #eee; vertical-align: middle; }
    tr:first-child td { border-top: 0; }
    .name strong { display: block; }
    .name code { color: #888; font-size: 11px; }
    .state { width: 70px; color: #888; font-size: 13px; }
    .state.set { color: #237a3b; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font: 12px ui-monospace, monospace; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    button { padding: 6px 12px; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #333; font: inherit; cursor: pointer; }
    button.primary { border-color: #6d4fd8; background: #6d4fd8; color: #fff; }
    button.link { border: 0; background: none; color: #a8071a; font-size: 13px; padding: 0; }
    #error { color: #a8071a; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>API keys</h1>
    <p>
      Your runs on this computer use these keys: each reaches its provider's models in Mochi's
      Settings → AI, where you can set them too. They stay on this computer, readable only by you,
      and are never shown again.
    </p>
    <table id="keys"></table>
    <p id="error" role="alert"></p>
    <div class="actions">
      <button id="back">Back to Mochi</button>
      <button id="save" class="primary">Save</button>
    </div>
  </main>
  <script>
    // The supervisor's key commands (src-tauri/src/supervisor.rs): which keys are set, and saving them.
    const invoke = (command, args) => window.__TAURI_INTERNALS__.invoke(command, args);
    const changes = {};

    function row({env, label, set}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="name"><strong></strong><code></code></td><td class="state"></td><td><input type="password" spellcheck="false" autocomplete="off"></td><td></td>`;
      tr.querySelector('strong').textContent = label;
      tr.querySelector('code').textContent = env;
      const state = tr.querySelector('.state');
      state.textContent = set ? 'Saved' : 'Not set';
      state.classList.toggle('set', set);
      const input = tr.querySelector('input');
      input.placeholder = set ? 'Paste a new key to replace it' : 'Paste a key';
      input.addEventListener('input', () => {
        if (input.value.trim()) changes[env] = input.value.trim();
        else delete changes[env];
      });
      if (set) {
        const remove = document.createElement('button');
        remove.className = 'link';
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => {
          changes[env] = null;
          input.value = '';
          input.disabled = true;
          state.textContent = 'Removing';
        });
        tr.lastElementChild.append(remove);
      }
      return tr;
    }

    async function load() {
      const table = document.getElementById('keys');
      table.replaceChildren(...(await invoke('keys')).map(row));
    }

    document.getElementById('save').addEventListener('click', async () => {
      document.getElementById('error').textContent = '';
      try {
        await invoke('save_keys', {changes});
        await invoke('open_site');
      } catch (error) {
        document.getElementById('error').textContent = String(error);
      }
    });
    document.getElementById('back').addEventListener('click', () => invoke('open_site'));
    load();
  </script>
</body>
</html>
