_ > nanoagent.cli.plugin.PluginAgentConfig:

# The meal-suggestion plugin's suggest-meal task, worked by an agent: a vegetarian dinner with
# at least 50 g of protein and 10 g of fiber, at most 1000 kcal, and as much protein as possible.
plugin: plugins/meal-suggestion
task: suggest-meal
arguments:
  - ingredients=inputs/ingredients.json
  - recipes=inputs/recipes.json
  - meal=dinner
  - 'constraints={"protein": {"min": 50}, "kcal": {"max": 1000}, "fiber": {"min": 10}}'
  - 'preference={"require": ["vegetarian"], "exclude": []}'
  - 'objective={"sense": "maximize", "nutrient": "protein"}'
  - max_servings=2
inputs:
  - plugins/meal-suggestion/tests/fixtures/ingredients.json
  - plugins/meal-suggestion/tests/fixtures/recipes.json
timeout: 300.0

llm > nanoagent.llm.bedrock.BedrockConfig:
  model: us.anthropic.claude-opus-5-5
  region: us-west-2
  profile: codex-DO-NOT-DELETE
  temperature: null
  max_tokens: 4096
  max_attempts: 5
  read_timeout: 300.0
  input_price: 0.0
  output_price: 0.0

harness > nanoagent.harness.nanoagent.NanoAgentConfig:
  max_steps: 30
  cost_limit: null
  token_limit: null
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null
