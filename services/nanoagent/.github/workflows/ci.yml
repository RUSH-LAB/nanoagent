name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # No uv.lock here (a library pins nothing), so key the cache on pyproject.toml —
          # otherwise setup-uv warns that the cache can never be invalidated.
          cache-dependency-glob: pyproject.toml
          # Both matrix legs resolve the same glob, so without a suffix they race for one
          # cache key and the loser warns "unable to reserve cache".
          cache-suffix: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            packages/pi-runner/package-lock.json
      - run: uv python install ${{ matrix.python-version }}
      # Install the web extra for ASGI tests. Deliberately omit `serve`: those tests stub
      # huggingface_hub and sglang_router, so installing them would only slow CI and hide an
      # accidental module-level import.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,web]"
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: TypeScript client
        working-directory: packages/client
        run: npm ci && npm test && git diff --exit-code -- src/events.generated.ts src/request.generated.ts
      - name: PI runner
        working-directory: packages/pi-runner
        run: npm ci && npm test
