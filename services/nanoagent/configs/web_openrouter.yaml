# Internal NanoAgent service for a web application. The application server calls this process;
# browsers never do. Model, tool and budget policy live here and cannot be overridden per request.

default_profile: native-deepseek
profiles:
  native-deepseek:
    label: DeepSeek V4 Flash · NanoAgent
    model: deepseek/deepseek-v4-flash-0731
    harness:
      type: native
      command: null
      cwd: null
      options: {}
    model_overrides: {}
  hermes-deepseek:
    label: DeepSeek V4 Flash · Hermes Agent
    model: deepseek/deepseek-v4-flash-0731
    harness:
      type: hermes
      command: null
      cwd: null
      options:
        provider: openrouter
        toolsets: []
    model_overrides: {}
  pi-deepseek:
    label: DeepSeek V4 Flash · PI
    model: deepseek/deepseek-v4-flash-0731
    harness:
      type: pi
      # Use the companion package from this checkout instead of relying on a
      # globally linked npm executable.
      command: [node, packages/pi-runner/dist/index.js]
      cwd: null
      options:
        provider: openrouter
        api_key_env: OPENROUTER_API_KEY
        thinking_level: "off"
        system_prompt: You are an assistant embedded in a collaborative knowledge application.
    model_overrides: {}

defaults:
  - configs/models/openrouter.yaml

model:
  max_tokens: 2048
  request_timeout: 120.0
  max_retries: 2

agent:
  system_prompt: |
    You are an assistant embedded in a collaborative knowledge application.
    Follow the application's additional instructions and answer the user directly.
  # With no advertised tools the first reply is final. Keep a second step in reserve so the
  # harness does not inject its last-step warning before an ordinary one-turn chat answer.
  max_steps: 2
  cost_limit: 0.10
  token_limit: 8192
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null

# Start without host filesystem or shell access. Add application-specific remote tools only after
# their authorization boundary is defined and tested.
tools: []
tools_dir: null
allowed_tools: []

host: 127.0.0.1
port: 8787
api_token: null
max_concurrency: 8
request_timeout: 180.0
max_request_bytes: 262144
max_output_chars: 50000
heartbeat_seconds: 10.0
include_reasoning: false
