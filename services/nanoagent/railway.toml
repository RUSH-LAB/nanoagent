[build]
builder = "RAILPACK"
buildCommand = "pip install '.[web]'"

[deploy]
startCommand = "python -m nanoagent web web_cfg=configs/web_openrouter.yaml host=0.0.0.0 port=$PORT api_token=$NANOAGENT_API_TOKEN"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
