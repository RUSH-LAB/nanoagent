_ > nanoagent.plugin.manifest.ManifestConfig:
id: word-check
name: Word Check
version: 0.1.0
status: ready
nanoagent: ~=0.6.0

runtime > nanoagent.plugin.manifest.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.manifest.PermissionsConfig:
  network > nanoagent.plugin.manifest.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.manifest.FilesystemConfig:
    write: []

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.manifest.ToolConfig]:
  parse_words:
    description: Read the reference and raw texts' words
  read_words:
    description: Read one text's words

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.manifest.TaskConfig]:
  check-words:
    description: Check words against trusted words
    runner: decide
    tools: [read_words]
    reference: parse_words
    instructions: |-
      Check each raw word against the reference words: read the reference text, then the raw text, with read_words.
      A word is unreadable when read_words gives it an error. Otherwise its closest word is the reference word equal to it, else the first reference word equal to it ignoring case. It is known when the closest word equals it, changed when the closest word equals it only ignoring case, and new when there is no closest word.
      The output has one verdict per raw word, in the raw text's order: the word; its label; closest, its closest word or null; differs, for a changed word where its case differs from the closest word (first, the first letter; rest, any later letter) and null otherwise; error, the read_words error for an unreadable word and null otherwise.
