_ > mockllm.engine.Scenario:
name: one-shot-answer
case: acceptance-probe-01
# One model call, no tool: the answer is submitted at once.
turns:
  - ttfb: 0.4
    stream: {chunks: 4, gap: 0.1}
    reasoning: "Compute the digest."
    text: "Answering."
    act: {answer: {digest: "@reference"}}
    usage: {prompt: 900, cached: 0, completion: 40, reasoning: 15, cache_write: 0}
  # NanoAgent calls its model once more after `submit`; this closing turn ends its loop.
  - ttfb: 0.3
    stream: {chunks: 2, gap: 0.05}
    text: "Submitted."
    usage: {prompt: 1500, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
expect: {correct: true}
