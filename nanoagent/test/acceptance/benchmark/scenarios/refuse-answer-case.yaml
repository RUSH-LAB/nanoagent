_ > mockllm.engine.Scenario:
name: refuse-answer-case
case: acceptance-probe-01
turns:
  - ttfb: 0.4
    stream: {chunks: 4, gap: 0.1}
    act: {refuse: "I will not answer this"}
    usage: {prompt: 900, cached: 0, completion: 40, reasoning: 0, cache_write: 0}
  # A coding harness refuses by a shell call that writes answer.json and then asks the model once more; this
  # closing turn answers that. NanoAgent's refusal is the final text, so it never requests it.
  - ttfb: 0.3
    stream: {chunks: 2, gap: 0.05}
    text: "Refused."
    usage: {prompt: 1500, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
expect: {correct: false, verdict_contains: "refused a case to answer"}
