_ > mockllm.engine.Scenario:
name: no-answer
case: acceptance-probe-01
# One wait, then the agent ends with plain text and no answer: a coding harness leaves no answer.json, and
# NanoAgent (where plain text is a refusal) ends the run as a refusal.
turns:
  - ttfb: 0.1
    stream: {chunks: 2, gap: 0.05}
    text: "Waiting."
    act: {wait: 0.0}
    usage: {prompt: 500, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
  - ttfb: 0.2
    stream: {chunks: 2, gap: 0.05}
    text: "I could not find an answer."
    usage: {prompt: 600, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
expect: {correct: false}
