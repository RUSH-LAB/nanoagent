_ > mockllm.engine.Scenario:
name: parallel-tools
case: acceptance-probe-01
# Two waits (1.0 s and 0.5 s) in one turn: tool time is their union (1.0 s), not their sum.
turns:
  - ttfb: 0.5
    stream: {chunks: 4, gap: 0.05}
    text: "Waiting twice."
    act: [{wait: 1.0}, {wait: 0.5}]
    usage: {prompt: 1000, cached: 0, completion: 60, reasoning: 0, cache_write: 0}
  - ttfb: 0.4
    stream: {chunks: 4, gap: 0.05}
    text: "Done."
    act: {answer: {digest: "@reference"}}
    usage: {prompt: 1300, cached: 1000, completion: 30, reasoning: 0, cache_write: 0}
  # NanoAgent calls its model once more after `submit`; this closing turn ends its loop.
  - ttfb: 0.3
    stream: {chunks: 2, gap: 0.05}
    text: "Submitted."
    usage: {prompt: 1500, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
expect: {correct: true}
