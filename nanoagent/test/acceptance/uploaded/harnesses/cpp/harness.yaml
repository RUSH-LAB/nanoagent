protocol: rush.harness.v1
name: cpp
version: "1"
dialects: [chat_completions]
toolchain: cpp-20
lockfiles: []
# json.hpp (nlohmann/json, pinned) is staged beside main.cpp by the test; SHA-256 comes from the image's static OpenSSL.
build:
  argv: [g++, -std=c++20, -O2, -static, -I., main.cpp, -o, /build-out/harness, -lcrypto, -ldl, -lpthread]
  outputs: [harness]
run:
  argv: [/harness/harness]
