protocol: rush.harness.v1
name: go
version: "1"
dialects: [chat_completions]
toolchain: go-1
lockfiles: [go.mod, go.sum]
# GOPROXY is a file proxy over the staged, go.sum-verified module zips (see the toolchain profile).
build:
  argv: [go, build, -trimpath, -o, /build-out/harness, .]
  outputs: [harness]
run:
  argv: [/harness/harness]
