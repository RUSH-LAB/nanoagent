protocol: rush.harness.v1
name: java
version: "1"
dialects: [chat_completions]
toolchain: java-21
lockfiles: [maven.lock]
# The locked jars are staged read-only at /deps/lib; javac and the JVM read them from there and from /harness/lib.
build:
  argv: [sh, -c, "mkdir -p /build-out/classes /build-out/lib && javac -cp '/deps/lib/*' -d /build-out/classes Main.java && cp /deps/lib/*.jar /build-out/lib/"]
  outputs: [classes, lib]
run:
  argv: [java, -cp, "/harness/classes:/harness/lib/*", Main]
