protocol: rush.harness.v1
name: rust
version: "1"
dialects: [chat_completions]
toolchain: rust-1
lockfiles: [Cargo.lock]
# The crates come from the staged vendor directory (source replacement in /deps/cargo-config.toml); nothing is fetched.
# The target directory lives in /build-out, which is executable (build scripts cannot run from /tmp), and is removed afterwards.
build:
  argv: [sh, -c, "CARGO_TARGET_DIR=/build-out/.target cargo build --release --frozen --offline --config /deps/cargo-config.toml && cp /build-out/.target/release/harness /build-out/harness && rm -rf /build-out/.target"]
  outputs: [harness]
run:
  argv: [/harness/harness]
