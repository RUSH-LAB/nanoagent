protocol: rush.harness.v1
name: typescript
version: "1"
dialects: [chat_completions]
toolchain: typescript-5
lockfiles: [package-lock.json]
# The locked typescript compiler and @types/node come from /deps/node_modules; /src is read-only, so compile a copy in /tmp.
build:
  argv: [sh, -c, "mkdir /tmp/p && cp -r package.json tsconfig.json src /tmp/p/ && ln -s /deps/node_modules /tmp/p/node_modules && cd /tmp/p && node node_modules/typescript/bin/tsc -p . --outDir /build-out/dist"]
  outputs: [dist]
run:
  argv: [node, /harness/dist/main.js]
