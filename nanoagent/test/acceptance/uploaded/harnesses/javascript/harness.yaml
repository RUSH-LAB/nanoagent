protocol: rush.harness.v1
name: javascript
version: "1"
dialects: [chat_completions]
toolchain: javascript-22
lockfiles: [package-lock.json]
# /deps/node_modules holds the lock-verified packages; the runtime resolves them from /harness/node_modules.
build:
  argv: [sh, -c, "cp main.js /build-out/main.js && cp -r /deps/node_modules /build-out/node_modules"]
  outputs: [main.js, node_modules]
run:
  argv: [node, /harness/main.js]
