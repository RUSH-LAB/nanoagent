protocol: rush.harness.v1
name: anthropic-sdk
version: "1"
dialects: [anthropic_messages]
toolchain: python-3
lockfiles: [requirements.txt]
build:
  argv: [sh, -c, "python -m pip install --quiet --no-index --find-links /deps --require-hashes --target /build-out/site -r requirements.txt && cp main.py /build-out/"]
  outputs: [main.py, site]
run:
  argv: [python, /harness/main.py]
