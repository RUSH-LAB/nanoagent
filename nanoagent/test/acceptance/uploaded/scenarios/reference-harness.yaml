_ > mockllm.engine.Scenario:
name: reference-harness
# A coding reference harness (Claude Code, Codex) on two cases, one after the other (the run's concurrency is 1): the answer case,
# then the refusal case. Each is a shell call that writes answer.json (the mock renders it per harness: see mockllm/actions.py),
# and the closing turn the harness asks for after that call.
turns:
  - ttfb: 0.3
    stream: {chunks: 4, gap: 0.05}
    text: "Answering."
    act: {answer: {digest: "@reference"}}
    usage: {prompt: 900, cached: 0, completion: 40, reasoning: 0, cache_write: 0}
  - ttfb: 0.2
    stream: {chunks: 2, gap: 0.05}
    text: "Submitted."
    usage: {prompt: 1500, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
  - ttfb: 0.3
    stream: {chunks: 4, gap: 0.05}
    text: "No digest exists for this token."
    act: {refuse: "refuse- tokens have no digest"}
    usage: {prompt: 950, cached: 0, completion: 40, reasoning: 0, cache_write: 0}
  - ttfb: 0.2
    stream: {chunks: 2, gap: 0.05}
    text: "Refused."
    usage: {prompt: 1550, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
side_usage: {prompt: 20, cached: 0, completion: 2, reasoning: 0, cache_write: 0}
