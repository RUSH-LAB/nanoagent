_ > mockllm.engine.Scenario:
name: nanoagent-harness
# The NanoAgent harness (the reference harness nanoagent) on two runs, one after the other. Turns 1-3: an agent task, a streamed `wait`
# proposal, the turn that submits the digest, and the closing turn NanoAgent's loop needs after `submit`. Turns 4-5: a decide
# task, whose model calls are structured answers (a `response_format` request, no tools): first to call `wait`, then to
# submit; every other value of the task is copied (a field with one option takes it with no question).
turns:
  - ttfb: 0.1
    stream: {chunks: 4, gap: 0.02}
    text: "Working."
    act: {wait: 0.5}
    usage: {prompt: 900, cached: 0, completion: 40, reasoning: 0, cache_write: 0}
  - ttfb: 0.1
    stream: {chunks: 3, gap: 0.02}
    text: "Done."
    act: {answer: {digest: "@reference"}}
    usage: {prompt: 1100, cached: 800, completion: 30, reasoning: 0, cache_write: 0}
  - ttfb: 0.1
    stream: {chunks: 2, gap: 0.02}
    text: "Submitted."
    usage: {prompt: 1300, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
  - ttfb: 0.1
    stream: {chunks: 1, gap: 0.02}
    act: {decide: {next: wait}}
    usage: {prompt: 500, cached: 0, completion: 8, reasoning: 0, cache_write: 0}
  - ttfb: 0.1
    stream: {chunks: 1, gap: 0.02}
    act: {decide: {next: submit}}
    usage: {prompt: 700, cached: 0, completion: 8, reasoning: 0, cache_write: 0}
