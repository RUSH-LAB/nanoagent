_ > mockllm.engine.Scenario:
name: core-engine
case: acceptance-probe-01
# The NanoAgent core engine on the probe case: a streamed `wait` proposal, the follow-up turn that carries its tool result
# and submits the digest, and the closing turn NanoAgent's loop needs after `submit`. Usage differs per call so a swapped
# or double-counted field shows in the reconciliation: call 1 writes 300 prompt tokens to the cache, call 2 reads 1000.
turns:
  - ttfb: 0.3
    stream: {chunks: 6, gap: 0.05}
    reasoning: "Need to wait, then answer."
    text: "Working."
    act: {wait: 1.0}
    usage: {prompt: 1000, cached: 0, completion: 50, reasoning: 20, cache_write: 300}
  - ttfb: 0.2
    stream: {chunks: 4, gap: 0.05}
    text: "Done."
    act: {answer: {digest: "@reference"}}
    usage: {prompt: 1200, cached: 1000, completion: 30, reasoning: 10, cache_write: 0}
  - ttfb: 0.1
    stream: {chunks: 2, gap: 0.05}
    text: "Submitted."
    usage: {prompt: 1500, cached: 0, completion: 10, reasoning: 0, cache_write: 0}
expect: {correct: true}
