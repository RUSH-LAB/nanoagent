_ > mockllm.engine.Scenario:
name: gateway-core
# The scripted harness on the note case: one streamed, fragmented proposal for the plugin's write_note, then the closing turn.
# The same scenario serves two upstreams, so the usage of each call is what both ledgers must show.
turns:
  - ttfb: 0.1
    stream: {chunks: 5, gap: 0.02}
    text: "Writing."
    act: {call: {name: write_note, arguments: {name: note.txt, text: hello gateway}}}
    usage: {prompt: 400, cached: 0, completion: 30, reasoning: 5, cache_write: 100}
  - ttfb: 0.1
    stream: {chunks: 3, gap: 0.02}
    text: "Done."
    usage: {prompt: 500, cached: 400, completion: 10, reasoning: 0, cache_write: 0}
expect: {correct: true}
