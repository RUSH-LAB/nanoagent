# The NanoAgent that Mochi's contract check (helpinghands/scripts/maintenance/verify-nanoagent.mjs)
# runs against, owned here so it always matches this checkout's configuration. The check sets
# model.base_url to its fake model, port, and workspaces.
_ > nanoagent.web.config.WebConfig:

model > nanoagent.runtime.config.ModelConfig:
  model: fake
  provider: sglang
  base_url: MISSING
  api_key: null
  aws_region: null
  aws_profile: null
  temperature: 0.0
  max_tokens: 64
  request_timeout: 5.0
  max_retries: 0
  extra_body: []
  input_price: 0.0
  output_price: 0.0

agent > nanoagent.runtime.config.AgentConfig:
  system_prompt: You are Mochi's deterministic integration verifier.
  max_steps: 2
  cost_limit: null
  token_limit: 1000
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null

tools: []
tools_dir: null
allowed_tools: []

default_profile: nanoagent-fake
profiles:
  - deploy/contract/profiles/nanoagent-fake.yaml
# The fixture plugin NanoAgent's own tests use, offered for the check's package calls.
packages:
  - test/plugins/word-check
workspaces: MISSING
# Beside the workspaces, so a checker that names only those runs any version of this file.
installs: ${workspaces}-installs
uv_cache: ${workspaces}-uv-cache
installs_unused_days: 30
# The Python plugins run on: the one NanoAgent runs on here.
plugin_python: python
sandbox: none

host: 127.0.0.1
port: MISSING
api_token: null
max_concurrency: 2
request_timeout: 10.0
max_request_bytes: 16384
max_file_bytes: 1048576
max_output_chars: 1000
heartbeat_seconds: 1.0
include_reasoning: false
# Runs choose among the profiles above, within the limits above (RUSH Lab sets true).
run_models: false
