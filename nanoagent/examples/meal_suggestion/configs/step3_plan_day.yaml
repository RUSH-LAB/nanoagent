_ > nanoagent.cli.plugin.PluginAgentConfig:

# The meal-suggestion plugin's plan-day task, worked by an agent on the plugin's Food.com recipes.
plugin: plugins/meal-suggestion
task: plan-day
# The task's input, a contract.DayInput as JSON: breakfast, lunch and dinner, each within its own kcal
# (and dinner's protein), and the day within 1600 to 2200 kcal, at least 90 g of protein and 30 g of
# fiber, at most 2300 mg of sodium and 22 g of saturated fat; only Healthy recipes, none Meat, Poultry
# or Dessert, one serving of each, for an eater who loves dairy, likes chocolate and dislikes
# mushrooms. Healthy keeps the lists short (67 recipes over the three meals) so an agent can weigh them.
arguments: examples/meal_suggestion/configs/step3_plan_day_arguments.json
# The plugin carries its recipes: the task reads no file.
inputs: []
timeout: 600.0

llm > nanoagent.llm.bedrock.BedrockConfig:
  model: us.anthropic.claude-opus-5-5
  region: us-west-2
  profile: codex-DO-NOT-DELETE
  temperature: null
  # Planning three meals at once takes long replies.
  max_tokens: 16000
  max_attempts: 5
  read_timeout: 300.0
  input_price: 0.0
  output_price: 0.0

harness > nanoagent.harness.nanoagent.NanoAgentConfig:
  max_steps: 30
  cost_limit: null
  token_limit: null
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null
