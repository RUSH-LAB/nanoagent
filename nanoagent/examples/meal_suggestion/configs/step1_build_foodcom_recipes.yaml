# Food.com's recipes (Kaggle irkaal/foodcom-recipes-and-reviews, version 2, CC0), and the SHA-256
# of the recipes.parquet inside the download.
url: https://www.kaggle.com/api/v1/datasets/download/irkaal/foodcom-recipes-and-reviews/recipes.parquet?datasetVersionNumber=2
sha256: 9f591abe9f8d1c691bbc630b0431ec6613f09fabe93f1789af87a06484aae9fb
# Only recipes with this many reviews or more.
min_reviews: 50
# A recipe is for a meal when its Food.com category or one of its keywords is one of these.
meals:
  breakfast: [Breakfast]
  lunch: [Lunch/Snacks]
  dinner: [One Dish Meal]
