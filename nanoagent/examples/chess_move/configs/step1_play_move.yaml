_ > nanoagent.cli.plugin.PluginAgentConfig:

# The chess-move plugin's play-move task, worked by an agent on a live board.
plugin: plugins/chess-move
task: play-move
# A middle-game Italian: white's knight on c3 forks black's queen on d5, which is sitting on d5
# after taking the e4 pawn. The clear best is Nxd5, winning the queen.
# The task's input, a contract.Position as JSON.
arguments: examples/chess_move/configs/step1_play_move_arguments.json
inputs: []
timeout: 180.0

llm > nanoagent.llm.bedrock.BedrockConfig:
  model: us.anthropic.claude-opus-5-5
  region: us-west-2
  profile: codex-DO-NOT-DELETE
  temperature: null
  max_tokens: 4096
  max_attempts: 5
  read_timeout: 300.0
  input_price: 0.0
  output_price: 0.0

harness > nanoagent.harness.nanoagent.NanoAgentConfig:
  max_steps: 30
  cost_limit: null
  token_limit: null
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null
