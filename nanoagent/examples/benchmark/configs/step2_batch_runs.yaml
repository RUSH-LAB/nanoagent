_ > step2_batch_runs.BatchConfig:

# Step 1's config, which every run starts from, and overrides of it for every run.
single_run: examples/benchmark/configs/step1_single_run.yaml
overrides: []
# Every step1_<name>_cases.json in this folder is one plugin task of the batch.
cases: examples/benchmark/configs
# How many of each task's cases to answer, and of those to refuse, from the first.
answer: 1
refuse: 0
harnesses: [nanoagent, claude, codex, hermes, pi, dsh]
# Cores each run gets, and the most runs at once (the plugins' data sources refuse too many at once:
# Open-Meteo answered city-weather's reference with HTTP 429 when every run started together).
cpus_per_run: 1
max_parallel: 3
# The npx packages step 1's harnesses table starts, fetched once before the runs.
packages: ["@openai/codex@0.167.0", "@deepseek-ai/dsh@0.2.2-rc.1"]
