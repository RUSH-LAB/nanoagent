_ > step3_profile.ProfileConfig:

# Step 2's cases, and the one this run works (the run script sets it for each case).
cases: examples/benchmark/outputs/step2_cases/cases.json
case: ???
# nanoagent (the plugin's task, as RUSH Lab runs it), or claude, codex, hermes, pi or dsh (the prompt).
harness: ???
model: deepseek/deepseek-v4-flash-0731
# openrouter (the harness's route below), or null for the harness's own login (claude, codex, hermes;
# dsh with DEEPSEEK_API_KEY).
provider: openrouter
# OpenRouter's price per million tokens for deepseek-v4-flash on 2026-11-05 (cached input at the
# full price: no cached price was listed).
input_price: 0.059
cached_input_price: 0.059
output_price: 0.3
timeout: 900.0

nanoagent > step3_profile.NanoAgentLoopConfig:
  harness > nanoagent.harness.nanoagent.NanoAgentConfig:
    max_steps: 10
    cost_limit: null
    token_limit: null
    context_window: null
    hooks: []
    skills: null
    context_files: []
    events: null
  max_attempts: 3
  read_timeout: 120.0

# Every harness but NanoAgent: its runner (run from nanoagent/), and how it reaches each provider.
harnesses > dict[step3_profile.Harness, step3_profile.HarnessConfig]:
  claude:
    command: [.venv/bin/nanoagent-claude-runner]
    options: {}
    routes > dict[step3_profile.Provider, step3_profile.Route]:
      # OpenRouter's Anthropic-compatible API.
      openrouter:
        options: {}
        env: {ANTHROPIC_BASE_URL: https://openrouter.ai/api, ANTHROPIC_API_KEY: ""}
        env_from: {ANTHROPIC_AUTH_TOKEN: OPENROUTER_API_KEY}
  codex:
    command: [.venv/bin/nanoagent-codex-runner]
    # The Codex release npx runs, pinned so every run profiles the same harness.
    options: {package: "@openai/codex@0.167.0"}
    routes > dict[step3_profile.Provider, step3_profile.Route]:
      # OpenRouter's Responses API, the only one Codex speaks.
      openrouter:
        options: {provider: openrouter, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
        env: {}
        env_from: {}
  hermes:
    command: [.venv/bin/nanoagent-hermes-runner]
    options: {}
    routes > dict[step3_profile.Provider, step3_profile.Route]:
      openrouter:
        options: {provider: openrouter}
        env: {}
        env_from: {}
  # js/pi-runner, built with `npm ci && npm run build` there; with PI's coding tools.
  pi:
    command: [node, js/pi-runner/dist/index.js]
    options: {tools: coding}
    routes > dict[step3_profile.Provider, step3_profile.Route]:
      openrouter:
        options: {provider: openrouter, api_key_env: OPENROUTER_API_KEY}
        env: {}
        env_from: {}
  dsh:
    command: [.venv/bin/nanoagent-dsh-runner]
    # The dsh release npx runs, pinned so every run profiles the same harness.
    options: {package: "@deepseek-ai/dsh@0.2.2-rc.1"}
    routes > dict[step3_profile.Provider, step3_profile.Route]:
      # pi-ai's OpenRouter route (dsh's DeepSeek route sends x-api-key, which OpenRouter refuses).
      openrouter:
        options: {provider: openrouter, api_key_env: OPENROUTER_API_KEY}
        env: {}
        env_from: {}
