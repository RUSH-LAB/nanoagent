_ > step2_single_run.SingleRunConfig:

# The local RUSH database that helpinghands' `npm run local` makes and fills with production's.
database: postgres://neondb_owner@127.0.0.1:55432/mochi
psql: /opt/homebrew/opt/postgresql@18/bin/psql
# The plugin task's cases, and the one this run works: <plugin>-<n>, the cases to answer first.
cases: examples/benchmark/configs/step1_city_weather_cases.json
case: city-weather-01
# nanoagent (the plugin's task, as RUSH Lab runs it), or claude, codex, hermes, pi or dsh (the prompt).
harness: nanoagent
model: deepseek/deepseek-v4-flash-0731
# Where every harness reaches its model: OpenRouter's API root (Claude Code gets the same server's
# Anthropic-compatible API, the root without /v1), and the variable holding its key. Point base_url
# at another server, e.g. a mock of OpenRouter, to move every harness there.
openrouter > step2_single_run.OpenRouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
# USD per million tokens, by model: the run's model must be here (step2_single_run.Model lists them).
prices > dict[step2_single_run.Model, step2_single_run.Prices]:
  # OpenRouter's prices for deepseek-v4-flash on 2026-11-05 (cache reads and writes at the input
  # price: no cache price was listed).
  deepseek/deepseek-v4-flash-0731:
    input: 0.059
    cached_input: 0.059
    cache_write: 0.059
    output: 0.3
prompt: |-
  Task: {description}.

  {context}

  The task's input:
  {arguments}

  The input's JSON Schema:
  {input_schema}

  Write your answer to {workspace}/answer.json: one JSON object following this JSON Schema.
  {output_schema}

  Keep temporary files in the workspace or the directory named by TMPDIR.

  If the input cannot be answered (the day or window has not ended, the market was closed, or no data covers it), write {{"refused": "<why>"}} to answer.json instead.

# Seconds the harness, and the reference tool, may take before the run fails.
timeout: 900.0
# Seconds setup may take, off the clock: fetching a harness's pinned npx package, and readying the
# plugin's Python environment (uv sync).
npm_timeout: 120.0
sync_timeout: 600.0

nanoagent > step2_single_run.NanoAgentLoopConfig:
  harness > nanoagent.harness.nanoagent.NanoAgentConfig:
    max_steps: 10
    cost_limit: null
    token_limit: null
    context_window: null
    hooks: []
    skills: null
    context_files: []
    events: null
  max_attempts: 3
  read_timeout: 120.0

# Every harness but NanoAgent: its runner (run from nanoagent/) and its options. Each reaches its model
# through `openrouter` above: Claude Code through its Anthropic-compatible API, Codex through its
# Responses API (the only one Codex speaks), Hermes, PI and dsh (pi-ai's OpenRouter route) through its
# chat completions.
harnesses > dict[step2_single_run.Harness, step2_single_run.HarnessConfig]:
  claude:
    command: [.venv/bin/nanoagent-claude-runner]
    options: {}
  codex:
    command: [.venv/bin/nanoagent-codex-runner]
    # The Codex release npx runs, pinned so every run profiles the same harness.
    # The benchmark's outer sandbox isolates evidence and allows the task's network access.
    options: {package: "@openai/codex@0.167.0", sandbox: danger-full-access}
  hermes:
    command: [.venv/bin/nanoagent-hermes-runner]
    options: {}
  # js/pi-runner, built with `npm ci && npm run build` there; with PI's coding tools.
  pi:
    command: [node, js/pi-runner/dist/index.js]
    options: {tools: coding, thinking_level: medium}
  dsh:
    command: [.venv/bin/nanoagent-dsh-runner]
    # The dsh release npx runs, pinned so every run profiles the same harness.
    # Use the benchmark's outer sandbox so dsh does not try to start a second one.
    # It reaches OpenRouter through pi-ai's route (dsh's DeepSeek route sends x-api-key, which
    # OpenRouter refuses).
    options: {package: "@deepseek-ai/dsh@0.2.2-rc.1", sandbox: danger-full-access, thinking_level: medium}
