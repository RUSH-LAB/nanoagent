_ > step5_import_runs.ImportConfig:

# Step 3's folder of runs, step 1's bugs file and its cases files.
runs: examples/benchmark/outputs/step3_batch_runs/runs
bugs: examples/benchmark/configs/plugin_bugs.json
cases: examples/benchmark/configs
# The benchmark the runs are kept under, and the endpoint profile they reached their model through (step 2's OpenRouter).
name: step3-batch-runs
endpoint_profile: openrouter
# The reference harness RUSH keeps each of step 2's harnesses' runs as.
harnesses:
  nanoagent: nanoagent
  claude: claude-code
  codex: codex
  hermes: hermes
  pi: pi
  dsh: dsh
# The member's workspace the runs are kept in.
workspace: comp-480-580
# RUSH Lab's data folder; null: whichever of RUSH Lab's and RUSH Lab Dev's is signed in.
lab: null
