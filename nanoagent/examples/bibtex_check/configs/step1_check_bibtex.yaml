_ > nanoagent.cli.plugin.PluginAgentConfig:

# The BibTeX check plugin's check-bibtex task, worked by an agent on the sample files' text.
plugin: plugins/bibtex-check
task: check-bibtex
# The task's input, a contract.ParseInput as JSON: tests/fixtures/reference.bib's and raw.bib's text.
arguments: examples/bibtex_check/configs/step1_check_bibtex_arguments.json
inputs: []
timeout: 300.0

llm > nanoagent.llm.bedrock.BedrockConfig:
  model: us.anthropic.claude-opus-5-5
  region: us-west-2
  profile: codex-DO-NOT-DELETE
  temperature: null
  max_tokens: 4096
  max_attempts: 5
  read_timeout: 300.0
  input_price: 0.0
  output_price: 0.0

harness > nanoagent.harness.nanoagent.NanoAgentConfig:
  max_steps: 30
  cost_limit: null
  token_limit: null
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null
