_ > nanoagent.cli.plugin.PluginOpenRouterAgentConfig:

# The BibTeX check plugin's check-bibtex task, run as its manifest says (runner: decide) on the sample files' text.
plugin: plugins/bibtex-check
task: check-bibtex
# The task's input, a contract.ParseInput as JSON: tests/fixtures/reference.bib's and raw.bib's text.
arguments: examples/bibtex_check/configs/step1_check_bibtex_arguments.json
inputs: []
timeout: 300.0

llm > nanoagent.llm.openrouter.OpenRouterConfig:
  model: anthropic/claude-sonnet-5.5
  temperature: null
  max_tokens: 4096
  max_attempts: 5
  read_timeout: 300.0
  # OpenRouter's list price per 1M tokens.
  input_price: 2.0
  output_price: 10.0

harness > nanoagent.harness.nanoagent.NanoAgentConfig:
  max_steps: 30
  cost_limit: null
  token_limit: null
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null
