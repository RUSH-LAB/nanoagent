_ > step2_submit_run.SubmitConfig:

server > nanoagent.uploaded.client.ServerConfig:
  base_url: ${oc.env:RUSH_BASE_URL,http://127.0.0.1:3000}
  workspace_id: ${oc.env:RUSH_WORKSPACE_ID}
  token_env: RUSH_SESSION_TOKEN
# The benchmark to run: a plugin, its version and the benchmark's name, all published with step 1.
# Everything else (model, endpoint, limits, the cases' prompts) is the benchmark's.
plugin: acceptance-probe
plugin_version: 0.1.0
benchmark: acceptance-probe
# The agents to run it with, one run each: claude, codex, pi, dsh, hermes, nanoagent, or one of yours as `rush <command>`.
harnesses: [claude, nanoagent]
# The same key and request return the same run, so a repeated submit never queues twice; each run's key is this and its harness.
idempotency_key: acceptance-probe-run-1
# Wait until every attempt of every run is sealed and the run is scored, and print each summary.
follow: true
poll_seconds: 2.0
follow_timeout: 3600.0
