# The default `nanoagent harness` config: a plugin's task worked by one reference harness, as the plugin page's Harness tab
# works it, through the RUSH that RUSH Lab on this computer is connected to.
#
#     nanoagent harness plugin=city-weather harness=claude-code                  # interactive: the harness's own screen here
#     nanoagent harness plugin=city-weather harness=codex prompt="Which cities…"   # one-shot, for scripts
#
# RUSH Lab Dev keeps its connection in lab.mochi.lab.dev:
#     nanoagent harness lab="$HOME/Library/Application Support/lab.mochi.lab.dev" plugin=… harness=…

_ > nanoagent.cli.harness.HarnessCommandConfig:

plugin: ???
harness: ???
prompt: null
task: null
model: null
home: null
workspace: null
# RUSH Lab's data folder (on Windows %LOCALAPPDATA%\lab.mochi.lab): its one connection names the site and holds the member's sign-in.
lab: ${oc.env:HOME}/Library/Application Support/lab.mochi.lab
