protocol: rush.harness.v1
name: nanoagent
version: "1"
dialects: [chat_completions]
toolchain: python-3
lockfiles: [requirements.txt]
# The build has no network: pip installs the hashed closure the worker staged under /deps (PIP_FIND_LINKS). `nanoagent/`
# is assembled from NanoAgent's working tree by assemble.py before the folder is uploaded; it is not committed here.
build:
  argv: [sh, -c, "python -m pip install --quiet --no-index --find-links /deps --require-hashes --target /build-out/site -r requirements.txt && cp -r main.py taskharness nanoagent /build-out/"]
  outputs: [main.py, taskharness, nanoagent, site]
run:
  argv: [python, /harness/main.py]
