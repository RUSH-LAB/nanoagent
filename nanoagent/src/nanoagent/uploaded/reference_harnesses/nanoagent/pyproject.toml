[project]
name = "nanoagent-task-tools-harness"
version = "0.1.0"
description = "NanoAgent as an uploaded harness for the task tools policy"
requires-python = ">=3.12"
# Only what the task tools path imports. NanoAgent's own lock (git-sourced slimconfig, omegaconf and antlr4 with no wheels,
# the web and CLI stacks) cannot be built from wheels; taskharness.shims stands in for the config stack's names.
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    # The version NanoAgent itself locks: the chat client resolves its HTTP module from the SDK.
    "openai==2.24.0",
]
