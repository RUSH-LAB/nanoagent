protocol: rush.harness.v1
name: dsh
version: "1"
dialects: [chat_completions]
toolchain: javascript-22
lockfiles: [package-lock.json]
# package-lock.json: reproduced by `.venv/bin/python src/nanoagent/uploaded/reference_harnesses/regenerate_locks.py` (`--check` verifies it).
# /deps/node_modules holds the lock-verified packages; build.sh keeps the build architecture's native packages and drops type declarations and source maps.
build:
  argv: [sh, build.sh]
  outputs: [main.mjs, node_modules]
run:
  argv: [node, /harness/main.mjs]
