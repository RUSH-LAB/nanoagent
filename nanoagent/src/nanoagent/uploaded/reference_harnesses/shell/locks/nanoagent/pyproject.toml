[project]
name = "nanoagent-task-tools-harness"
version = "0.1.0"
description = "NanoAgent's CLI (`nanoagent chat`, `mgen`) for the RUSH terminal"
requires-python = ">=3.12"
# What NanoAgent's CLI (`nanoagent chat`, `mgen`) imports, all from wheels. slimconfig (a git source) and
# omegaconf's antlr4 runtime (an sdist) have none: assemble.py copies them in, and requirements.txt leaves antlr4 out
# (`uv export --no-emit-package antlr4-python3-runtime`), so the build installs it with --no-deps.
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    # The version NanoAgent itself locks: the chat client resolves its HTTP module from the SDK.
    "openai==2.24.0",
    # slimconfig's own bounds.
    "omegaconf>=2.3,<2.4",
    "pyyaml",
    "rich",
]
