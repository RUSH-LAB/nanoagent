protocol: rush.harness.v1
name: pi
version: "1"
dialects: [chat_completions]
toolchain: javascript-22
lockfiles: [package-lock.json]
# package-lock.json: reproduced by `.venv/bin/python src/nanoagent/uploaded/reference_harnesses/regenerate_locks.py` (`--check` verifies it).
# /deps/node_modules holds the lock-verified packages (esbuild's binary among them); build.sh keeps them for the `pi` CLI.
build:
  argv: [sh, build.sh]
  outputs: [node_modules]
run:
  argv: ["true"]
