protocol: rush.harness.v1
name: shell
version: "1"
dialects: [chat_completions, responses, anthropic_messages]
toolchain: shell-1
lockfiles: []
# The member's own terminal: bash in the case workspace, the gateway preset (shell.py), with the reference CLIs on its PATH (bin/:
# nanoagent and mgen, claude, codex, pi, hermes, dsh) at the versions the reference harnesses lock, each installed by the worker the first time it is
# typed and kept for every session after (nanoagent.uploaded.clis), so this build only copies these files.
# `rush <command>` (rush.py) runs any other agent as one recorded run, scored when given the task's prompt.
build:
  argv: [sh, build.sh]
  outputs: [shell.py, bashrc, rush.py, build.sh, nanoagent_tools.py, bin]
run:
  argv: [python, /harness/shell.py]
