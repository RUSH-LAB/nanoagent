[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent"
# One source of truth: nanoagent.__version__ (see [tool.setuptools.dynamic] below).
dynamic = ["version"]
description = "A minimal, clean-room agent loop with structured tool calling — and the batch/REPL/CLI drivers around it"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# 3.12+: the package is written against the 3.12 typing syntax (`X | None` at runtime under
# `from __future__ import annotations`, `type` aliases, PEP 695-era generics).
requires-python = ">=3.12"
# The core loop (nanoagent.core.agent) imports the stdlib and nothing else — these are what the
# layers around it need. `openai` is listed but the loop never sees it: all transport goes through
# nanoagent.inference.backends.build_backend, which imports the SDK only when the sglang backend is
# actually built, so any object satisfying the `ChatModel` duck-type is a usable model.
dependencies = [
    "jsonschema>=4.23",
    "mcp>=1.27,<2",
    # The OpenAI-compatible client the sglang backend speaks. Floor at 1.40: the backend imports
    # `DefaultAsyncHttpxClient` from the package root and reads `completion_tokens_details` off the
    # usage object, neither of which exists on the 0.x SDK.
    #
    # httpx is deliberately NOT a direct dependency. openai 1.x/2.x builds on `httpx` and openai
    # >=3 on the renamed `httpx2` fork; the Limits/Timeout objects the backend configures the
    # client with have to come from whichever one the installed SDK uses, so it resolves that
    # module off the SDK itself (see inference/backends/sglang.py). Declaring `httpx` here would
    # pull in a second, unrelated copy and invite exactly the mismatch that resolution avoids.
    "openai>=1.40",
    # The Bedrock Converse client behind the default `mgen` model. Imported only when the bedrock
    # backend is built.
    "boto3>=1.35",
    # The YAML/config layer: `_default:` composition, typed schema loading, `key=value` tokens.
    # Floor at 0.14: the new dialect — `Config` schemas, `_ >` declarations on every file and
    # block, Enum-keyed mappings, no `Any` fields. nanoagent's schemas (see nanoagent.runtime.config)
    # are written against it (open string-keyed data lives in `key=value` token lists and
    # per-entry files instead). The loader API is unchanged between 0.14 and 0.15.
    # Follow SlimConfig's GitHub development branch; NanoAgent and SlimConfig evolve together.
    "slimconfig @ git+https://github.com/zeyuyang8/slimconfig.git@master",
    # Struct-mode merge onto the all-MISSING dataclass schemas in nanoagent.runtime.config, and the
    # tool-manifest reader in nanoagent.extensions.
    "omegaconf>=2.2",
    # `key=value` token values led by `[` / `{` parse as YAML flow collections (see
    # nanoagent.runtime.config._parse_kv_value). Also required transitively by slimconfig and
    # omegaconf, but imported directly here, so declared directly.
    "pyyaml",
    # Terminal rendering for `run`/`chat` (streaming, tool-call panels, the live batch progress).
    "rich",
    # The `browse` trajectory viewer, and nothing else.
    "textual",
    # Which wheels in a plugin's uv.lock this Python can install (nanoagent.plugin.install).
    "packaging",
    # Makes jsonschema's `uri` format check real (it is silently skipped without an RFC 3986
    # validator); the uploaded-harness wire schema relies on it (nanoagent.uploaded.contract).
    "rfc3986-validator",
    # Decodes gVisor's seccheck trace frames in the uploaded-harness process collector
    # (nanoagent.uploaded.collector). The generated modules under uploaded/seccheck need >= 7.35.1.
    "protobuf>=7.35.1,<8",
    # Imported directly by the plugin runtime and the uploaded-harness services (nanoagent.uploaded). The floor is the one `mcp`
    # already requires, so it adds no constraint.
    "anyio>=4.5",
    # The attempt-scoped gateway, tool broker and command service (nanoagent.uploaded.app) are one
    # ASGI app. httpx is the gateway's upstream transport: the plain `httpx` package on purpose,
    # independent of whichever httpx the openai SDK builds on (see the openai note above).
    "httpx>=0.27",
    "starlette>=0.41",
    "uvicorn>=0.30",
]
authors = [
    {name = "Zeyu Yang"},
]
keywords = ["llm", "agent", "tool-calling", "rollout", "trajectory", "repl"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
# ASGI web host for server-side application integrations. Kept optional so the batch / training
# package does not acquire an HTTP framework merely because it imports nanoagent.
web = ["jsonschema>=4.23", "starlette>=0.41", "uvicorn>=0.30"]
# Optional third-party harness. It is launched behind the subprocess boundary rather than
# imported into NanoAgent's server process, but this extra makes a single-environment setup easy.
hermes = ["hermes-agent==0.19.0"]
# The serve side (nanoagent.inference.serve / router): `ensure_weights` fetches missing shards
# through huggingface_hub, and mode=router/multinode fronts the engines with sglang_router. SGLang
# itself is NOT a dependency — the engine is exec'd as the `sglang serve` CLI, so the serving env
# owns that pin (it decides the CUDA/torch stack) and this package never constrains it. Both
# imports are inside the functions that need them, so an agent-only install pays nothing.
serve = ["huggingface-hub", "sglang-router>=0.3.2"]
# The token-level client (config.tokenizer, and backend="sglang_native" which requires it):
# transformers owns `apply_chat_template`, so it is what renders a conversation to input_ids. Not
# a base dependency — an install that only ever sends text never loads it, and
# nanoagent.inference.tokenizer imports it inside load_tokenizer to keep that true.
tokens = ["transformers"]
# Official dataset loading and Docker-based rule scoring for SWE-bench. Kept optional because
# ordinary question/answer benchmarks need neither Hugging Face datasets nor Docker bindings.
swebench = ["swebench>=5,<6"]
dev = [
    # The acceptance suite drives its mock Anthropic Messages endpoint with the real client.
    "anthropic",
    "pytest",
    "pytest-asyncio",
    "ruff",
    # Starlette's TestClient transport; Starlette itself comes from the `web` extra in CI.
    "httpx>=0.27",
    # Only `repl.commands.inline_image` touches it, to read an image's pixel size — and it falls
    # back to a guess when the import fails, so Pillow is a test dependency, not a runtime one.
    "pillow",
]

[project.urls]
Homepage = "https://github.com/RUSH-LAB/nanoagent"
Repository = "https://github.com/RUSH-LAB/nanoagent"

# So it is `nanoagent chat ...` rather than `python3 -m nanoagent chat ...`. Same entry point
# either way — __main__.py and this both call cli.main.
[project.scripts]
nanoagent = "nanoagent.cli.main:main"
# The coding-CLI face of the same agent, in Claude Code's flag grammar — its own name because
# `mgen -p "..."` is what a script written against `claude` already says.
mgen = "nanoagent.cli.mgen:main"
nanoagent-hermes-runner = "nanoagent.harness.adapters.hermes:main"
nanoagent-codex-runner = "nanoagent.harness.adapters.codex:main"
nanoagent-claude-runner = "nanoagent.harness.adapters.claude:main"
nanoagent-dsh-runner = "nanoagent.harness.adapters.dsh:main"

[tool.setuptools.dynamic]
version = {attr = "nanoagent.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nanoagent*"]

# src/nanoagent/configs/ ships INSIDE the package, unlike the repo-root configs/ (which are
# serving examples). These are not examples: `mgen` with no arguments loads configs/mgen.yaml, and
# that file names the three tool manifests. A default toolset that lives outside the wheel is a
# default toolset an installed `mgen` cannot find. See nanoagent.extensions.resolve_config.
# Package data belongs to the top-level package alongside ``py.typed``.
[tool.setuptools.package-data]
nanoagent = ["py.typed", "configs/*.yaml", "configs/tools/*.yaml", "web/schema/*.json", "plugin/template/**/*", "plugin/v0001/page/**/*", "uploaded/*.json", "uploaded/reference_harnesses/**/*"]

[tool.ruff]
line-length = 150
# protoc output: its imports register descriptor dependencies, so lint fixes must not touch it.
extend-exclude = ["src/nanoagent/uploaded/seccheck/*_pb2.py", "src/nanoagent/uploaded/seccheck/*_pb2.pyi"]

[tool.ruff.lint]
# Pinned, not inherited: ruff's default selection has widened across releases, so an unpinned
# config silently changes what "clean" means on every upgrade. These four are the set this
# package was written against — likely bugs, not style.
select = ["E4", "E7", "E9", "F"]
extend-ignore = ["E203"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
# Each fixture plugin under test/plugins/ is its own uv project and runs its own tests.
norecursedirs = ["plugins"]
# The external-harness acceptance tiers run locally and before benchmark releases, not on every run:
#   pytest test/acceptance/benchmark -m "acceptance or harness_claude or harness_codex or harness_pi or harness_dsh"
addopts = "-m 'not harness_claude and not harness_codex and not harness_pi and not harness_dsh and not gvisor and not rush_server and not uploaded_acceptance and not real_openrouter'"
markers = [
    "acceptance: benchmark acceptance tests against the scripted mock provider, NanoAgent only (no external binary)",
    "harness_claude: acceptance tests that need the local `claude` binary",
    "harness_codex: acceptance tests that need npx and the pinned @openai/codex package",
    "harness_pi: acceptance tests that need node and a built js/pi-runner/dist",
    "harness_dsh: acceptance tests that need npx and the pinned @deepseek-ai/dsh package",
    "rush_server: smoke tests that start the real RUSH server (helpinghands) on a scratch PostgreSQL database; run with -m rush_server",
    "uploaded_acceptance: uploaded-harness CLI acceptance: the CLI steps against a real RUSH server and a worker in the Lima VM (deploy/gvisor); run on the host with -m uploaded_acceptance",
    "real_openrouter: the real uploaded-harness CLI benchmark against live OpenRouter (spends money; needs OPENROUTER_API_KEY in the repository .env); run with -m real_openrouter",
    "gvisor: Linux integration tests that need Docker with the runsc-rush runtime and a running collector (deploy/gvisor)",
]
