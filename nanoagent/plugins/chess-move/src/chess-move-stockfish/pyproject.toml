# chess-move-stockfish: Stockfish, compiled from vendor/Stockfish into this package's wheel when
# the plugin is installed. setup.py does the build: see there.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-move-stockfish"
version = "0.1.0"
description = "Stockfish dev-20260803 (762dd1da9a5d), compiled with its NNUE net embedded"
requires-python = ">=3.12"
license = "GPL-3.0-only"

[tool.setuptools.packages.find]
where = ["src"]
