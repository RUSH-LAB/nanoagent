[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-chess-move"
version = "0.1.0"
description = "Play one chess move with the mouse on a live board, scored by Stockfish"
requires-python = ">=3.12"
# chess-move-stockfish (src/chess-move-stockfish/) is Stockfish, compiled into its wheel when this plugin is
# installed; websockets is how plugin.chrome talks to Chrome.
dependencies = ["chess-move-stockfish", "mcp>=1.27,<2", "slimconfig", "websockets>=15,<18"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
chess-move-stockfish = { path = "src/chess-move-stockfish" }
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import contract.py and the verifier package from the plugin root.
pythonpath = ["."]
