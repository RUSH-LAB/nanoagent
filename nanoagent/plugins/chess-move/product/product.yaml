_ > nanoagent.plugin.manifest.ProductConfig:
tagline: "An agent that plays chess on a real board"
summary: "It looks at a live chess board, chooses a move for the side to play and makes it with the mouse, the way a person would. Stockfish scores the move."
highlights:
  - "Sees the board as a screenshot, like a player"
  - "Moves pieces by dragging and clicking"
  - "Each move is scored by Stockfish"
steps:
  - "Paste a position, or tell it the moves of your game so far"
  - "It plays its move on a real board and shows you the board after it"
  - "Stockfish checks the move; reply with yours to keep the game going"
