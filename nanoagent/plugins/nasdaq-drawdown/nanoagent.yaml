_ > nanoagent.plugin.manifest.ManifestConfig:
id: nasdaq-drawdown
name: Nasdaq-100 Weekly Drawdown
version: 0.2.0
status: ready
nanoagent: ~=0.4.0

runtime > nanoagent.plugin.manifest.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.manifest.PermissionsConfig:
  network > nanoagent.plugin.manifest.NetworkConfig:
    hosts: [api.nasdaq.com]
  filesystem > nanoagent.plugin.manifest.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.manifest.ToolConfig]:
  pin_week:
    description: Pin every Nasdaq-100 constituent's close on a session and 5 sessions earlier
  list_constituents:
    description: List the Nasdaq-100 constituents and the 5-session week ending on a date
  get_closes:
    description: Get each ticker's daily close on a trading session

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.manifest.TaskConfig]:
  nasdaq-down-5:
    description: List the Nasdaq-100 stocks that fell by 5% or more over the five trading days ending on a date, each with its change
    runner: agent
    tools: [list_constituents, get_closes]
    reference: pin_week
    instructions: |-
      The week is the 5 trading sessions ending on as_of: each constituent's change is its close on as_of over its close on the session 5 sessions earlier, minus 1. It fell by at least 5% when that change is -5% or lower.
      Call list_constituents once with as_of: it gives the constituents and the week's first session (start).
      Call get_closes for every constituent on start and on as_of, at most 25 tickers per call.
      Then call submit once with exactly the constituents that fell by at least 5%, each with its change in percent rounded to the cent, or [] if none did.
