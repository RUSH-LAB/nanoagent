[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-meal-suggestion"
version = "0.2.1"
description = "Suggest a meal of whole recipe servings that meets nutrition constraints and a food preference"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "numpy", "scipy>=1.15", "slimconfig"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import contract.py and the verifier package from the plugin root.
pythonpath = ["."]
