_ > nanoagent.plugin.manifest.ProductConfig:
tagline: "Find arXiv papers and keep their sources"
summary: "Search arXiv by topic, author or date and save the LaTeX source of every paper you want into your workspace. It can also watch a list of people and write a short daily digest of their new papers."
highlights:
  - "Saves the full LaTeX source, not just the PDF"
  - "A daily digest of the people you follow"
  - "Every saved paper is checked against arXiv"
steps:
  - "Tell it in your own words which papers you want: a topic, a title, an author or an arXiv ID"
  - "It searches arXiv and shows the papers, with a button to save any one's source"
  - "Ask it to save a paper's LaTeX source, or a digest of a day's new papers by the people you follow"
