name: Quality and NanoAgent contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Mochi
        uses: actions/checkout@v4
        with:
          path: mochi-lab
      - name: Check out NanoAgent
        uses: actions/checkout@v4
        with:
          repository: zeyuyang8/nanoagent
          ref: master
          path: nanoagent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mochi-lab/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install Mochi
        working-directory: mochi-lab
        run: npm ci
      - name: Unit tests
        working-directory: mochi-lab
        run: npm test
      - name: Production build
        working-directory: mochi-lab
        run: npm run build:auth
      - name: Live NanoAgent contract
        working-directory: mochi-lab
        run: npm run nanoagent:verify
