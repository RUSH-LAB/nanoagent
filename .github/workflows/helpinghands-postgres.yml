name: Helping Hands PostgreSQL acceptance

# Only a pull request runs these: production changes only by merging one, and its checks
# decide; pushes to devmode are tested with npm test before they are pushed.
on:
  pull_request:
    branches: [production, devmode]
    paths:
      - '.github/workflows/helpinghands-postgres.yml'
      - 'helpinghands/package-lock.json'
      - 'helpinghands/package.json'
      - 'helpinghands/scripts/db/**'
      - 'helpinghands/src/server/**'
      - 'helpinghands/tests/unit/server/postgres-*.test.mjs'
      - 'helpinghands/tests/integration/postgres/**'

defaults:
  run:
    working-directory: helpinghands

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mochi
          POSTGRES_USER: mochi_owner
          POSTGRES_PASSWORD: mochi_owner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mochi_owner -d mochi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mochi_runtime:mochi_runtime_ci@127.0.0.1:5432/mochi
      DATABASE_MIGRATION_URL: postgres://mochi_owner:mochi_owner_ci@127.0.0.1:5432/mochi
      PG_DRIVER: pg
      PG_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/package-lock.json
      - run: npm ci
      - name: Create non-owner runtime role
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U mochi_owner -d mochi
          -c "create role mochi_runtime login password 'mochi_runtime_ci' nosuperuser nocreatedb nocreaterole noinherit nobypassrls"
      - name: Run real PostgreSQL acceptance tests
        run: npm run test:postgres

  # A release's pending migrations run against production's data, on a Neon
  # branch made from it for this job and deleted after, so a migration that
  # fails on real rows fails here and not in Railway's deploy.
  production-data:
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: curly-rice-08210507
      BRANCH: ci-migrations-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/package-lock.json
      - run: npm ci
      - name: Branch production's data
        run: >-
          npx neon branches create --project-id "$NEON_PROJECT_ID" --name "$BRANCH"
          --parent production --expires-at "$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)"
      - name: Apply the pending migrations
        run: |
          DATABASE_MIGRATION_URL="$(npx neon connection-string "$BRANCH" --project-id "$NEON_PROJECT_ID" --role-name neondb_owner --database-name neondb)"
          echo "::add-mask::$DATABASE_MIGRATION_URL"
          DATABASE_MIGRATION_URL="$DATABASE_MIGRATION_URL" node scripts/db/apply-schema.mjs
      - name: Delete the branch
        if: always()
        run: npx neon branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID"
