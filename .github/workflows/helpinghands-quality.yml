name: Helping Hands quality and NanoAgent contract

# Only a pull request runs these: production changes only by merging one, and its checks
# decide; pushes to devmode are tested with npm test before they are pushed.
on:
  pull_request:
    branches: [production, devmode]
    paths:
      - '.github/workflows/helpinghands-quality.yml'
      - 'helpinghands/**'
      - 'nanoagent/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: helpinghands

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install Mochi
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Live NanoAgent contract
        run: npm run nanoagent:verify

  # RUSH Lab cloud's runner (docs/infra/aws-deployment.md): NanoAgent's image started with
  # infra/aws/runner/run.sh's flags, shown to refuse Docker's default seccomp profile, and to
  # confine and bound every plugin (scripts/aws/verify-runner.mjs). bubblewrap makes user
  # namespaces, which Ubuntu's AppArmor refuses until this sysctl, as in NanoAgent's CI.
  cloud-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Let bubblewrap make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Mochi
        run: npm ci
      - name: Runner check
        run: npm run cloud:verify

  # Railway deploys Mochi and NanoAgent separately, so whichever side changed must work with the
  # other side as it is in production: this Mochi against production's NanoAgent, and production's
  # Mochi against this NanoAgent. A side that did not change is production's already.
  cross-version:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: This Mochi against production NanoAgent
            changed: helpinghands
            mochi: ./helpinghands
            nanoagent: ../production
          - name: Production Mochi against this NanoAgent
            changed: nanoagent
            mochi: ../production/helpinghands
            nanoagent: .
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did this side change
        id: side
        run: |
          if git diff --quiet origin/production...HEAD -- ${{ matrix.changed }}/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out production
        if: steps.side.outputs.changed == 'true'
        run: git worktree add ../production origin/production
      - uses: actions/setup-node@v4
        if: steps.side.outputs.changed == 'true'
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        if: steps.side.outputs.changed == 'true'
      - name: Install Mochi
        if: steps.side.outputs.changed == 'true'
        working-directory: ${{ matrix.mochi }}
        run: npm ci
      - name: Live NanoAgent contract across versions
        if: steps.side.outputs.changed == 'true'
        working-directory: ${{ matrix.mochi }}
        env:
          NANOAGENT_PROJECT_DIR: ${{ github.workspace }}/${{ matrix.nanoagent }}/nanoagent
        run: npm run nanoagent:verify
