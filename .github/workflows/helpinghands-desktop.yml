name: Helping Hands desktop app

# Builds RUSH Lab, the Tauri app (helpinghands/desktop) members download from the site, for each
# kind of Mac and for x86-64 Windows. Each target builds on its own runner, as the app bundles that
# system's runtimes (scripts/stage.mjs).
#
# The Mac app is ad-hoc signed (signingIdentity "-" in tauri.conf.json), not notarized: the first time
# it opens from the dmg, macOS blocks it until the member clicks Open Anyway in System Settings ->
# Privacy & Security. The Windows app is its NSIS installer (tauri.windows.conf.json), unsigned, so
# SmartScreen asks before an installer downloaded in a browser runs. It is a release (npm run
# build:release): it updates itself from the site it serves (src-tauri/src/update.rs), with the
# update this job signs with the app's update key (TAURI_SIGNING_PRIVATE_KEY) and uploads beside
# each app. On Windows the update is the installer itself.

# A push to production rebuilds the app only when something it is built from changed: desktop/
# (the app, its scripts and config.yaml), the runner, and the NanoAgent that stage.mjs bundles.
on:
  workflow_dispatch:
  push:
    branches: [production]
    paths:
      - '.github/workflows/helpinghands-desktop.yml'
      - 'helpinghands/desktop/**'
      - 'helpinghands/src/runner/**'
      - 'docs/instructions/skills/publish-plugin/SKILL.md'
      - 'nanoagent/pyproject.toml'
      - 'nanoagent/README.md'
      - 'nanoagent/LICENSE'
      - 'nanoagent/src/**'
      - 'nanoagent/js/pi-runner/**'
      - 'nanoagent/deploy/railway/**'

defaults:
  run:
    working-directory: helpinghands

jobs:
  # Each dmg and update, uploaded on a push to production to the Mochi it deploys, which serves them
  # to members (routes/lab.js). That Mochi may still be deploying the commit that serves the upload,
  # so each is tried for 15 minutes; a run by hand only builds, and keeps them as a workflow artifact.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: helpinghands/desktop
      - run: npm run build:release -- --target ${{ matrix.target }}
        working-directory: helpinghands/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: rush-lab-${{ matrix.target }}
          path: |
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
      # The command the site gives (irm <site>/install.ps1 | iex), run twice against this build served
      # as the site serves it: it installs RUSH Lab and opens it, then replaces the one running.
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe")
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)" }
          $env:SETUP = $setup[0].FullName
          $env:LAB_INSTALL = (Resolve-Path src/server/lab-install.js).Path
          $site = Join-Path $env:RUNNER_TEMP 'site.js'
          Set-Content -Path $site -Value @'
          const fs = require('fs'), crypto = require('crypto'), {windowsScript} = require(process.env.LAB_INSTALL);
          const setup = fs.readFileSync(process.env.SETUP);
          require('http').createServer((req, res) => {
            if (req.url === '/install.ps1') return res.end(windowsScript('http://127.0.0.1:8123'));
            if (req.url !== '/api/lab/bundles/${{ matrix.target }}') { res.statusCode = 404; return res.end(); }
            res.setHeader('X-Lab-Sha256', crypto.createHash('sha256').update(setup).digest('hex'));
            res.end(setup);
          }).listen(8123, '127.0.0.1');
          '@
          $server = Start-Process node -ArgumentList "`"$site`"" -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 2
            $folder = Join-Path $env:LOCALAPPDATA 'RUSH Lab'
            foreach ($round in 1, 2) {
              irm http://127.0.0.1:8123/install.ps1 | iex
              $deadline = (Get-Date).AddSeconds(60)
              while (-not @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$folder\", 'OrdinalIgnoreCase') }).Count) {
                if ((Get-Date) -gt $deadline) { throw "RUSH Lab is not running from $folder after install $round" }
                Start-Sleep -Seconds 1
              }
            }
          } finally {
            Stop-Process -Id $server.Id -Force
          }
      - name: Upload to Mochi
        if: github.event_name == 'push'
        working-directory: helpinghands/desktop
        env:
          LAB_UPLOAD_TOKEN: ${{ secrets.LAB_UPLOAD_TOKEN }}
        run: |
          if [ -z "$LAB_UPLOAD_TOKEN" ]; then
            echo "The LAB_UPLOAD_TOKEN secret is not set" >&2
            exit 1
          fi
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          stamp=$(cat src-tauri/resources/stamp)
          # put <file> <route> [header]: PUT the file to rush-lab.org's route, for 15 minutes.
          put() {
            deadline=$(( $(date +%s) + 900 ))
            until curl -fsS -X PUT --data-binary @"$1" \
                -H "Authorization: Bearer $LAB_UPLOAD_TOKEN" -H "X-Lab-Stamp: $stamp" ${3:+-H "$3"} \
                "https://rush-lab.org$2"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Mochi did not take $1 within 15 minutes" >&2
                exit 1
              fi
              sleep 30
            done
          }

