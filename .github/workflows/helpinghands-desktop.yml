name: Helping Hands desktop app

# Builds the Tauri app (helpinghands/desktop) for macOS on Apple silicon, the one platform it
# ships for now (Windows and Linux: helpinghands/FUTURE.md). Every push to production is a release
# and builds it, as can a run by hand; the bundle is uploaded as a workflow artifact. NanoAgent is
# compiled here by Nuitka (scripts/stage.mjs), which cannot cross-compile: each target builds on its
# own runner.
#
# The macOS app is ad-hoc signed (signingIdentity "-" in tauri.conf.json), not notarized: on
# another Mac it opens after right-click -> Open, or Open Anyway in System Settings -> Privacy.

on:
  workflow_dispatch:
  push:
    branches: [production]

defaults:
  run:
    working-directory: helpinghands

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: helpinghands/desktop
      - run: npm run build -- --target ${{ matrix.target }}
        working-directory: helpinghands/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mochi-lab-${{ matrix.target }}
          path: helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Mochi Lab without its window (desktop/PLAN.md): the bundle install.sh downloads, one per Mac
  # architecture, each built on its own runner, and uploaded to the Mochi this push deploys. The
  # site may still be deploying the commit that serves the upload, so it is tried for 15 minutes.
  lab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/desktop/package-lock.json
      - run: npm ci
        working-directory: helpinghands/desktop
      - run: npm run bundle:lab
        working-directory: helpinghands/desktop
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      - name: Upload to Mochi
        working-directory: helpinghands/desktop
        env:
          LAB_UPLOAD_TOKEN: ${{ secrets.LAB_UPLOAD_TOKEN }}
        run: |
          bundle=dist/mochi-lab-${{ matrix.target }}.tar.gz
          stamp=$(tar -xOzf "$bundle" mochi-lab/stamp)
          deadline=$(( $(date +%s) + 900 ))
          until curl -fsS -X PUT --data-binary @"$bundle" \
              -H "Authorization: Bearer $LAB_UPLOAD_TOKEN" -H "X-Lab-Stamp: $stamp" \
              https://rush-lab.org/api/lab/bundles/${{ matrix.target }}; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Mochi did not take the bundle within 15 minutes" >&2
              exit 1
            fi
            sleep 30
          done
