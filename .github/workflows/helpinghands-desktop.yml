name: Helping Hands desktop app

# Builds RUSH Lab, the Tauri app (helpinghands/desktop) members download from the site, for each
# kind of Mac. NanoAgent is compiled here by Nuitka (scripts/stage.mjs), which cannot
# cross-compile: each target builds on its own runner.
#
# The app is ad-hoc signed (signingIdentity "-" in tauri.conf.json), not notarized: the first time
# it opens on a member's Mac, macOS blocks it until they click Open Anyway in System Settings ->
# Privacy & Security. It is a release (npm run build:release): it updates itself from the site it
# serves (src-tauri/src/update.rs), with the update this job signs with the app's update key
# (TAURI_SIGNING_PRIVATE_KEY) and uploads beside each dmg.

# A push to production rebuilds the app only when something it is built from changed: desktop/
# (the app, its scripts and config.yaml), the runner, and the NanoAgent that stage.mjs compiles.
on:
  workflow_dispatch:
  push:
    branches: [production]
    paths:
      - '.github/workflows/helpinghands-desktop.yml'
      - 'helpinghands/desktop/**'
      - 'helpinghands/src/runner/**'
      - 'nanoagent/pyproject.toml'
      - 'nanoagent/README.md'
      - 'nanoagent/LICENSE'
      - 'nanoagent/src/**'
      - 'nanoagent/js/pi-runner/**'
      - 'nanoagent/deploy/railway/**'

defaults:
  run:
    working-directory: helpinghands

jobs:
  # Each dmg and update, uploaded on a push to production to the Mochi it deploys, which serves them
  # to members (routes/lab.js). That Mochi may still be deploying the commit that serves the upload,
  # so each is tried for 15 minutes; a run by hand only builds, and keeps them as a workflow artifact.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: helpinghands/desktop
      - run: npm run build:release -- --target ${{ matrix.target }}
        working-directory: helpinghands/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: rush-lab-${{ matrix.target }}
          path: |
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
      - name: Upload to Mochi
        if: github.event_name == 'push'
        working-directory: helpinghands/desktop
        env:
          LAB_UPLOAD_TOKEN: ${{ secrets.LAB_UPLOAD_TOKEN }}
        run: |
          if [ -z "$LAB_UPLOAD_TOKEN" ]; then
            echo "The LAB_UPLOAD_TOKEN secret is not set" >&2
            exit 1
          fi
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          stamp=$(cat src-tauri/resources/stamp)
          # put <file> <route> [header]: PUT the file to rush-lab.org's route, for 15 minutes.
          put() {
            deadline=$(( $(date +%s) + 900 ))
            until curl -fsS -X PUT --data-binary @"$1" \
                -H "Authorization: Bearer $LAB_UPLOAD_TOKEN" -H "X-Lab-Stamp: $stamp" ${3:+-H "$3"} \
                "https://rush-lab.org$2"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Mochi did not take $1 within 15 minutes" >&2
                exit 1
              fi
              sleep 30
            done
          }
          set -- "$bundle"/dmg/*.dmg
          [ "$#" -eq 1 ] || { echo "Expected one dmg, found $#" >&2; exit 1; }
          put "$1" /api/lab/bundles/${{ matrix.target }}
          update="$bundle/macos/RUSH Lab.app.tar.gz"
          put "$update" /api/lab/updates/${{ matrix.target }} "X-Lab-Signature: $(cat "$update.sig")"
