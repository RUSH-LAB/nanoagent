name: Helping Hands desktop app

# Builds the Tauri app (helpinghands/desktop) on each platform it ships for. Run it by hand or
# by pushing a desktop-v* tag; the bundles are uploaded as workflow artifacts.
#
# The macOS build is signed and notarized, and refuses to run without these secrets:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD    the Apple ID and an app-specific password, for notarization
#   APPLE_TEAM_ID

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

defaults:
  run:
    working-directory: helpinghands

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the signing secrets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is not set"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helpinghands/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: helpinghands/desktop
      - run: npm run build -- --target ${{ matrix.target }}
        working-directory: helpinghands/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mochi-lab-${{ matrix.target }}
          path: |
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            helpinghands/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
