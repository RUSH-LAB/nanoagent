name: Benchmark worker image

# The member-run benchmark worker's golden image (nanoagent/deploy/gvisor/Dockerfile). Pushed to the hosung-k1m namespace
# with a token of that account (GHCR_TOKEN, scope write:packages): the repository's own GITHUB_TOKEN cannot push there.
on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/benchmark-worker-image.yml'
      - 'nanoagent/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hosung-k1m/benchmark-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: nanoagent
          file: nanoagent/deploy/gvisor/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rush-benchmark-worker:test
          cache-from: type=gha,scope=benchmark-worker-amd64
          cache-to: type=gha,scope=benchmark-worker-amd64,mode=max
      # The gVisor tests need the worker's Linux host: dockerd, runsc-rush and the packet filter, which the entrypoint brings up.
      - name: gVisor tests
        run: |
          docker run --rm --init --privileged --cgroupns=private rush-benchmark-worker:test \
            pytest -p no:cacheprovider -o addopts="" -m "gvisor or not gvisor" \
            test/uploaded/test_sandbox_gvisor.py test/uploaded/test_sandbox_supervisor.py \
            test/uploaded/test_collector.py test/uploaded/test_toolchains.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: hosung-k1m
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: nanoagent
          file: nanoagent/deploy/gvisor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=benchmark-worker-multi
          cache-to: type=gha,scope=benchmark-worker-multi,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
