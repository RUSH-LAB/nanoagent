name: Benchmark worker image

# The member-run benchmark worker's golden image (nanoagent/deploy/gvisor/Dockerfile). Each platform is built once on a
# native runner, tested as that exact image and, on a push to production, pushed by digest; the manifest job then joins
# the tested digests into one multi-arch tag.
on:
  push:
    # worker-image-first-publish: a one-off branch that publishes PR #29's head before this workflow is on production.
    branches: [production, worker-image-first-publish]
    paths:
      - '.github/workflows/benchmark-worker-image.yml'
      - 'nanoagent/**'
  pull_request:
    paths:
      - '.github/workflows/benchmark-worker-image.yml'
      - 'nanoagent/pyproject.toml'
      - 'nanoagent/uv.lock'
      - 'nanoagent/README.md'
      - 'nanoagent/LICENSE'
      - 'nanoagent/src/**'
      - 'nanoagent/deploy/gvisor/**'
      - 'nanoagent/test/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/benchmark-worker

# A newer push to a pull request supersedes its run; a run that publishes is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: nanoagent
          file: nanoagent/deploy/gvisor/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: rush-benchmark-worker:test
          cache-from: type=gha,scope=benchmark-worker-${{ matrix.runner }}
          cache-to: type=gha,scope=benchmark-worker-${{ matrix.runner }},mode=max
      # The plugin sandbox (bwrap) works in unprivileged user namespaces, which Docker Desktop's VM allows and the runner's
      # Ubuntu AppArmor strips of capabilities. The sysctl is the host kernel's, so the privileged container below inherits
      # it; on a host that keeps the restriction the worker refuses to start (worker.py, `sandbox.check`). Setuid bwrap is no
      # way around it: it refuses --size.
      - name: Sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The gVisor tests need the worker's Linux host: dockerd, runsc-rush and the packet filter, which the entrypoint brings up.
      - name: gVisor tests
        run: |
          docker run --rm --init --privileged --cgroupns=private rush-benchmark-worker:test \
            pytest -p no:cacheprovider -o addopts="" -m "gvisor or not gvisor" \
            test/uploaded/test_sandbox_gvisor.py test/uploaded/test_sandbox_supervisor.py \
            test/uploaded/test_collector.py test/uploaded/test_toolchains.py \
            test/uploaded/test_runner_gvisor.py test/uploaded/test_tool_sandbox_gvisor.py \
            test/uploaded/test_reference_builds_gvisor.py test/test_sandbox.py
      # Only the tested image is pushed: by digest, from the same build.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image by digest
        id: push
        if: github.event_name != 'pull_request'
        run: |
          docker tag rush-benchmark-worker:test "${IMAGE,,}:${{ github.sha }}-${{ matrix.runner }}"
          docker push "${IMAGE,,}:${{ github.sha }}-${{ matrix.runner }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE,,}:${{ github.sha }}-${{ matrix.runner }}")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Keep the digest for the manifest
        if: github.event_name != 'pull_request'
        run: |
          # An artifact's file names may not hold ':', so the file is the digest's hex alone.
          digest="${{ steps.push.outputs.digest }}"
          mkdir digests
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*

  manifest:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch image from the tested digests
        id: index
        working-directory: digests
        run: |
          image="${IMAGE,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create -t "$image:${{ github.sha }}" $(printf "$image@sha256:%s " *)
          echo "digest=$(docker buildx imagetools inspect "$image:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
