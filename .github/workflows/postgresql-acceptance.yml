name: PostgreSQL acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/postgresql-acceptance.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/db/**'
      - 'scripts/migrations/sqlite-to-postgres.mjs'
      - 'src/server/**'
      - 'tests/unit/server/postgres-*.test.mjs'
      - 'tests/integration/postgres/**'
  push:
    branches: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mochi
          POSTGRES_USER: mochi_owner
          POSTGRES_PASSWORD: mochi_owner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mochi_owner -d mochi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mochi_runtime:mochi_runtime_ci@127.0.0.1:5432/mochi
      DATABASE_MIGRATION_URL: postgres://mochi_owner:mochi_owner_ci@127.0.0.1:5432/mochi
      PG_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create non-owner runtime role
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U mochi_owner -d mochi
          -c "create role mochi_runtime login password 'mochi_runtime_ci' nosuperuser nocreatedb nocreaterole noinherit nobypassrls"
      - name: Run real PostgreSQL acceptance tests
        run: npm run test:postgres
