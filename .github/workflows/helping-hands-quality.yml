name: Helping Hands quality and NanoAgent contract

on:
  pull_request:
    branches: [production]
    paths:
      - '.github/workflows/helping-hands-quality.yml'
      - 'helping-hands/**'
      - 'nanoagent/**'
  push:
    branches: [production]
    paths:
      - '.github/workflows/helping-hands-quality.yml'
      - 'helping-hands/**'
      - 'nanoagent/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: helping-hands

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helping-hands/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install Mochi
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build:auth
      - name: Live NanoAgent contract
        run: npm run nanoagent:verify
